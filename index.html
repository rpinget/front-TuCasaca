<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TuCasaca | Camisetas de fútbol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      // aplica el tema guardado antes de pintar, para que no parpadee
      try {
        var t = localStorage.getItem('tema');
        if (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'oscuro';
        if (t === 'oscuro') document.documentElement.dataset.tema = 'oscuro';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
